name: Sync SHOGIMAN-IOS bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/expo-phase1
    paths:
      - '.gitmodules'
      - 'reference/shogiman-ios'
      - 'scripts/build-shogiman-ios.mjs'
      - 'package.json'
      - '.github/workflows/sync-ios-ui.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical SHOGIMAN-IOS bundle
        run: npm run sync:ios-ui
      - name: Commit generated HTML bundle
        run: |
          if git diff --quiet -- src/generated/shogimanIosHtml.ts; then
            echo "Bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/shogimanIosHtml.ts
          git commit -m "Sync bundled SHOGIMAN-IOS UI"
          git push
